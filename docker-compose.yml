services:
  store:
    build: .
    image: luckybrand-store
    restart: unless-stopped
    env_file: .env.docker
    ports:
      # local only: the web server (Apache) forwards the public traffic here
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    extra_hosts:
      # lets DATABASE_URL reach a MySQL running on the server itself
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - nextcache:/app/.next/cache # resized images survive updates

volumes:
  nextcache:
